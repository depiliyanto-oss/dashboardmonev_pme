name: Sync Google Sheet Data

on:
  schedule:
    # Setiap hari pukul 01:00 WIB (18:00 UTC hari sebelumnya). Sesuaikan cron (UTC) jika perlu.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-google-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Sync data from Google Sheets
        run: |
          python scripts/sync_google_sheet.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monev.json js/monev-data.js
          git add -f data/source/google-sheet.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): sync from Google Sheets [skip ci]"
            git push
          fi
