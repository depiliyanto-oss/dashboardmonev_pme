<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A278"/>
      <stop offset="100%" stop-color="#007F5F"/>
    </linearGradient>
    <linearGradient id="kemTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>
  </defs>
  <!-- Background circle badge -->
  <circle cx="60" cy="60" r="54" fill="url(#kemGreen)" opacity="0.12"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#kemGreen)" stroke-width="2.5" stroke-dasharray="3 3"/>
  
  <!-- Health Cross with Modern Leaf Shape -->
  <g transform="translate(60,60)">
    <!-- Vertical bar -->
    <rect x="-10" y="-32" width="20" height="64" rx="10" fill="url(#kemGreen)"/>
    <!-- Horizontal bar -->
    <rect x="-32" y="-10" width="64" height="20" rx="10" fill="url(#kemGreen)"/>
    <!-- Center glow -->
    <circle cx="0" cy="0" r="13" fill="#ffffff"/>
    <circle cx="0" cy="0" r="8" fill="url(#kemTeal)"/>
    <!-- Leaf swirl overlay -->
    <path d="M-6,-24 C10,-24 24,-10 24,6 C24,18 12,24 0,24 C-12,24 -24,14 -20,0 C-17,-12 -12,-20 -6,-24 Z" 
          fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  </g>
</svg>
